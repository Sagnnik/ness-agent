name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Verify source and installable packages
        run: uv run --no-sync python scripts/check_release.py --dist-dir dist

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
