[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ness_agent", "src/ness_cli"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/website",
    "/.agents",
    "/.ness",
    "/assets/ness-demo6.mp4",
]

[project]
name = "ness-agent"
version = "0.2.3"
description = "Ness Agent is an experimental, hackable agent harness."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Sagnnik Biswas" }]
keywords = ["agent", "langgraph", "coding-agent", "cli", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langchain-openrouter>=0.2.3",
    "langgraph>=1.2.1",
    "keyring>=25.6.0",
    "mcp>=1.27.1,<2",
    "Pillow>=10.0.0",
    "platformdirs>=4.0.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=12.6.0",
    "trafilatura>=2.1.0",
    "typer>=0.24.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
evals = [
    "harbor[modal]>=0.21.0",
    "modal>=1.5.4",
]

[project.urls]
Homepage = "https://github.com/Sagnnik/ness-agent"
Documentation = "https://github.com/Sagnnik/ness-agent/tree/main/docs"
Repository = "https://github.com/Sagnnik/ness-agent"
Issues = "https://github.com/Sagnnik/ness-agent/issues"
Changelog = "https://github.com/Sagnnik/ness-agent/blob/main/CHANGELOG.md"

[project.scripts]
ness = "ness_cli.tui.main:main"

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that contact paid external providers",
    "packaging: opt-in wheel build and clean-install smoke tests",
]
